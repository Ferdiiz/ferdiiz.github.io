<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./styles.css">
        
    </head> 
    <body>
        <div class="container">
            <div>
            
                <h1 class = "header_text"><b>Do you want to be my Valentine?♡♡</b></h1>
            </div>
            <div class="gif_container">

                <img src="cina1.gif" alt="Cute animated illustration">
            </div>
            <br><br>
            <div class = "buttons">
                <button class="btn" id = "yesButton" onclick="nextPage()"><b>YESS<img src="cina2.gif" width="80" height="55" alt="Cute animated illustration"></b></button> 
                <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()"><b>NOO<img src="cina3.webp" width="70" height="55" alt="Cute animated illustration"></b></button>
                <script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }
                    
                    function moveButton() {
                        var x = Math.random() * (window.innerWidth - document.getElementById('noButton').offsetWidth) - 85;
                        var y = Math.random() * (window.innerHeight - document.getElementById('noButton').offsetHeight) - 48;
                        document.getElementById('noButton').style.left = `${x}px`;
                        document.getElementById('noButton').style.top = `${y}px`;
                    }
                </script> 
            </div>
        </div>
       
    </body> 
</html>
